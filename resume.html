<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Ravish Shetty</title>
  <meta name="description" content="Ravish Shetty — Product Designer | UX/UI Designer. View and download resume.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f2019;
      --paper: #ffffff;
      --ink: #142019;
      --muted: #65736d;
      --accent: #e51b3e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    /* NAVBAR (same floating pill as the home page) */

    .top-nav {
      position: fixed;
      bottom: clamp(12px, 2.2vh, 22px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: fit-content;
      max-width: calc(100vw - 40px);
      height: 64px;
      min-height: 64px;
      padding: 0 16px 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;

      font-family: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #f4f4f5;
      background: rgba(30,30,30,.9);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      box-shadow: 0 -6px 30px rgba(0,0,0,.45);
    }

    .nav-brand {
      flex-shrink: 0;
      color: #f4f4f5;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-links {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-links a {
      position: relative;
      z-index: 1;
      padding: 10px 16px;
      border-radius: 999px;
      color: #e4e4e7;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Sliding hover pill (positioned by the small script at the bottom) */
    .nav-indicator {
      position: absolute;
      top: 50%;
      left: 0;
      width: 0;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      transform: translate(0, -50%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition:
        transform .35s cubic-bezier(0.19, 1, 0.22, 1),
        width .35s cubic-bezier(0.19, 1, 0.22, 1),
        opacity .2s ease;
    }

    /* PAGE */

    main {
      min-height: 100vh;
      padding: 48px 20px 140px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .resume-shell {
      width: min(412px, 100%);
      border-radius: 12px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 28px 70px rgba(0,0,0,.25);
    }

    /* TOOLBAR */

    .resume-toolbar {
      min-height: 72px;
      padding: 16px 21px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      background: #f5f9f7;
      border-bottom: 1px solid #e7ece9;
    }

    .resume-meta {
      min-width: 0;
    }

    .resume-meta h1 {
      margin: 0 0 4px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .resume-meta p {
      margin: 0;
      color: #71817a;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 500;
    }

    .download-btn {
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 12px 17px;
      border-radius: 999px;

      background: var(--accent);
      color: white;
      text-decoration: none;

      font-size: 11px;
      line-height: 1;
      font-weight: 800;

      transition: transform .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(.95);
    }

    .download-icon {
      font-size: 15px;
      line-height: 1;
    }

    /* PDF VIEWER */

    .pdf-viewer {
      width: 100%;
      background: #fff;
      position: relative;

      /*
        Prevent the resume itself from becoming a separate
        scrolling / dragging area.
      */
      overflow: hidden;
      touch-action: pan-y;
    }

    .pdf-page {
      position: relative;
      width: 100%;
      background: #fff;
      line-height: 0;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /*
      PDF.js creates clickable link annotations here.
    */
    .link-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .link-layer a {
      position: absolute;
      display: block;
      text-decoration: none;
      cursor: pointer;

      /*
        Keep links clickable without visually changing
        the resume.
      */
      background: transparent;
    }

    .link-layer a:hover {
      background: rgba(229,27,62,.06);
    }

    /* ERROR / FALLBACK */

    .fallback {
      display: none;
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .fallback a {
      display: inline-flex;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    /* TABLET */

    @media (max-width: 968px) {

      .top-nav {
        height: 52px;
        min-height: 52px;
      }

      .nav-links {
        gap: 2px;
      }

      .nav-links a {
        padding: 8px 10px;
        font-size: 12px;
      }

      .nav-indicator {
        display: none;
      }
    }

    /* MOBILE */

    @media (max-width: 640px) {

      .top-nav {
        height: 52px;
        min-height: 52px;
        gap: 14px;
        padding: 0 12px 0 18px;
        justify-content: center;
        max-width: calc(100vw - 24px);
      }

      .nav-links {
        gap: 0;
      }

      .nav-links a {
        padding: 8px 7px;
        font-size: 12px;
      }

      .nav-indicator {
        display: none;
      }

      .nav-brand {
        font-size: 13px;
      }

      main {
        padding-top: 32px;
        padding-bottom: 120px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .resume-toolbar {
        padding: 13px 14px;
        min-height: 66px;
      }

      .resume-meta h1 {
        font-size: 12px;
      }

      .resume-meta p {
        font-size: 8px;
      }

      .download-btn {
        padding: 10px 13px;
        font-size: 10px;
      }
    }

    @media (max-width: 430px) {

      .nav-brand {
        max-width: 112px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {

      .nav-links a {
        padding: 8px 6px;
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <header class="top-nav" aria-label="Main navigation">

    <a class="nav-brand" href="index.html">rjs</a>

    <nav class="nav-links">
      <a href="index.html#about">about</a>
      <a href="index.html#work">work</a>
      <a href="resume.html" aria-current="page">resume</a>
      <a href="index.html#contact">contact</a>
    </nav>
  </header>


  <!-- MAIN -->

  <main>

    <section
      class="resume-shell"
      aria-label="Ravish Shetty resume"
    >

      <!-- TOOLBAR -->

      <div class="resume-toolbar">

        <div class="resume-meta">
          <h1>Ravish’s Resume</h1>
          <p>Last updated on Sep 2026</p>
        </div>

        <a
          class="download-btn"
          href="assets/ravishshetty_.pdf"
          download
        >
          <span class="download-icon">↓</span>
          <span>Download PDF</span>
        </a>

      </div>


      <!-- PDF -->

      <div
        class="pdf-viewer"
        id="pdfViewer"
      ></div>


      <!-- FALLBACK -->

      <div
        class="fallback"
        id="fallback"
      >
        Your browser can’t preview the resume here.<br>

        <a
          href="assets/ravishshetty_.pdf"
          target="_blank"
          rel="noopener"
        >
          Open Resume PDF
        </a>
      </div>

    </section>

  </main>


  <!-- PDF.JS SCRIPT -->

  <script type="module">

    import {
      getDocument,
      GlobalWorkerOptions
    } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const pdfUrl = "assets/ravishshetty_.pdf";

    const viewer = document.getElementById("pdfViewer");
    const fallback = document.getElementById("fallback");


    let pdfDoc = null;
    let renderToken = 0;

    async function renderResume() {

      const token = ++renderToken;

      try {

        pdfDoc = pdfDoc || await getDocument(pdfUrl).promise;
        const pdf = pdfDoc;

        if (token !== renderToken) return;

        viewer.replaceChildren();

        /*
          Your resume is currently one page.
        */

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

          const page = await pdf.getPage(pageNumber);

          if (token !== renderToken) return;

          const originalViewport = page.getViewport({
            scale: 1
          });

          /*
            Fit the PDF exactly to the width of the
            resume card.
          */

          const containerWidth = viewer.clientWidth;

          const scale =
            containerWidth / originalViewport.width;

          const viewport = page.getViewport({
            scale: scale
          });


          /* PAGE CONTAINER */

          const pageContainer =
            document.createElement("div");

          pageContainer.className = "pdf-page";

          pageContainer.style.width =
            `${viewport.width}px`;

          pageContainer.style.height =
            `${viewport.height}px`;


          /* CANVAS */

          const canvas =
            document.createElement("canvas");

          const context =
            canvas.getContext("2d");

// Render at a higher internal resolution so the resume
// stays sharp when the browser/page is zoomed.
const devicePixelRatio = window.devicePixelRatio || 1;
const renderScale = Math.min(
  Math.max(devicePixelRatio * 2, 2),
  4
);

canvas.width =
  Math.ceil(viewport.width * renderScale);

canvas.height =
  Math.ceil(viewport.height * renderScale);

// Keep the displayed size unchanged.
canvas.style.width =
  `${viewport.width}px`;

canvas.style.height =
  `${viewport.height}px`;

context.setTransform(
  renderScale,
  0,
  0,
  renderScale,
  0,
  0
);


          /* LINK LAYER */

          const linkLayer =
            document.createElement("div");

          linkLayer.className =
            "link-layer";


          /*
            Read the actual links embedded
            inside your PDF.
          */

          const annotations =
            await page.getAnnotations({
              intent: "display"
            });


          annotations.forEach(annotation => {

            if (
              annotation.subtype !== "Link" ||
              !annotation.rect
            ) {
              return;
            }


            const rect =
              viewport.convertToViewportRectangle(
                annotation.rect
              );

            const left =
              Math.min(rect[0], rect[2]);

            const top =
              Math.min(rect[1], rect[3]);

            const width =
              Math.abs(rect[2] - rect[0]);

            const height =
              Math.abs(rect[3] - rect[1]);


            const link =
              document.createElement("a");

            link.style.left =
              `${left}px`;

            link.style.top =
              `${top}px`;

            link.style.width =
              `${width}px`;

            link.style.height =
              `${height}px`;


            /*
              External URL
            */

            if (annotation.url) {

              link.href =
                annotation.url;

              link.target =
                "_blank";

              link.rel =
                "noopener noreferrer";

            }


            /*
              Internal PDF destination.
              This is not needed for your current
              one-page resume, but keeps the renderer
              robust.
            */

            else if (annotation.dest) {

              link.href =
                "#";

              link.addEventListener(
                "click",
                event => {
                  event.preventDefault();
                }
              );

            }


            if (
              annotation.title
            ) {
              link.setAttribute(
                "aria-label",
                annotation.title
              );
            }


            linkLayer.appendChild(link);

          });


          pageContainer.appendChild(canvas);

          pageContainer.appendChild(linkLayer);

          viewer.appendChild(pageContainer);


          /*
            Render actual PDF page.
          */

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

        }

      } catch (error) {

        console.error(
          "Unable to render resume:",
          error
        );

        viewer.style.display =
          "none";

        fallback.style.display =
          "block";

      }

    }


    renderResume();


    /*
      Browser zoom / moving between screens changes the pixel
      ratio. Re-render so the resume stays sharp.
    */

    let lastDpr = window.devicePixelRatio;

    setInterval(() => {
      if (window.devicePixelRatio !== lastDpr) {
        lastDpr = window.devicePixelRatio;
        renderResume();
      }
    }, 500);
  </script>

  <script>
    (function () {
      const nav = document.querySelector(".top-nav .nav-links");
      if (!nav || matchMedia("(hover: none), (pointer: coarse)").matches) return;

      const links = Array.from(nav.querySelectorAll("a"));
      const pill = document.createElement("span");
      pill.className = "nav-indicator";
      pill.setAttribute("aria-hidden", "true");
      nav.prepend(pill);

      function moveTo(link) {
        const a = link.getBoundingClientRect(), b = nav.getBoundingClientRect();
        pill.style.width = a.width + "px";
        pill.style.transform = "translate(" + (a.left - b.left) + "px, -50%)";
        pill.style.opacity = "1";
      }

      links.forEach((l) => l.addEventListener("mouseenter", () => moveTo(l)));
      nav.addEventListener("mouseleave", () => { pill.style.opacity = "0"; });
      addEventListener("resize", () => {
        const h = nav.querySelector("a:hover");
        if (h) moveTo(h);
      });
    })();
  </script>

</body>
</html>
