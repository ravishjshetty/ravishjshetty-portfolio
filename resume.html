<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Ravish Shetty</title>
  <meta name="description" content="Ravish Shetty — Product Designer | UX/UI Designer. View and download resume.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f2019;
      --paper: #ffffff;
      --ink: #142019;
      --muted: #65736d;
      --accent: #e51b3e;
      --nav-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .top-nav {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: min(484px, calc(100vw - 28px));
      min-height: 44px;
      padding: 0 14px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,.98);
      border-radius: 13px;
      box-shadow: var(--nav-shadow);
      border: 1px solid rgba(15,32,25,.08);
    }

    .nav-brand {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      font-size: 12px;
      font-weight: 500;
      flex: 1;
    }

    .nav-links a {
      text-decoration: none;
      transition: opacity .2s ease;
    }

    .nav-links a:hover { opacity: .55; }

    .nav-socials {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-link {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      transition: transform .2s ease, opacity .2s ease;
    }

    .social-link:hover { transform: translateY(-1px); opacity: .65; }

    main {
      min-height: 100vh;
      padding: 184px 20px 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .resume-shell {
      width: min(412px, 100%);
      border-radius: 12px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 28px 70px rgba(0,0,0,.25);
    }

    .resume-toolbar {
      min-height: 72px;
      padding: 16px 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #f5f9f7;
      border-bottom: 1px solid #e7ece9;
    }

    .resume-meta { min-width: 0; }

    .resume-meta h1 {
      margin: 0 0 4px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .resume-meta p {
      margin: 0;
      color: #71817a;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 500;
    }

    .download-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 17px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      transition: transform .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(.95);
    }

    .download-icon {
      font-size: 15px;
      line-height: 1;
    }

    .pdf-frame-wrap {
  width: 100%;
  background: white;
  overflow: hidden;
  line-height: 0;
}

.resume-image {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}


    .fallback {
      display: none;
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .fallback a {
      display: inline-flex;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .top-nav {
        min-height: 42px;
        padding-left: 14px;
        padding-right: 12px;
      }

      .nav-links { gap: 14px; font-size: 10px; }
      .nav-socials { gap: 8px; }
      .nav-brand { font-size: 11px; }

      main { padding-top: 120px; padding-left: 12px; padding-right: 12px; }

      .resume-toolbar {
        padding: 13px 14px;
        min-height: 66px;
      }

      .resume-meta h1 { font-size: 12px; }
      .resume-meta p { font-size: 8px; }
      .download-btn { padding: 10px 13px; font-size: 10px; }
    }

    @media (max-width: 430px) {
      .nav-brand { display: none; }
      .nav-links { gap: 18px; }
      .top-nav { justify-content: center; }
      .nav-socials { display: none; }
    }
  </style>
</head>
<body>
  <header class="top-nav" aria-label="Main navigation">
    <a class="nav-brand" href="index.html">Hi, I’m Ravish</a>
    <nav class="nav-links">
      <a href="#about">about</a>
      <a href="#work">work</a>
      <a href="resume.html" aria-current="page">resume</a>
      <a href="#contact">contact</a>
    </nav>
    <div class="nav-socials">
      <a class="social-link" href="https://www.linkedin.com/in/ravish-shetty-4a9375283" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
    </div>
  </header>

  <main>
    <section class="resume-shell" aria-label="Ravish Shetty resume">
      <div class="resume-toolbar">
        <div class="resume-meta">
          <h1>Ravish’s Resume</h1>
          <p>Last updated on Sep 2026</p>
        </div>
        <a class="download-btn" href="assets/ravishshetty.pdf" download>
          <span class="download-icon">↓</span>
          <span>Download PDF</span>
        </a>
      </div>

      <div class="pdf-frame-wrap">
  <img
    class="resume-image"
    src="assets/ravishshetty-resume.webp"
    alt="Ravish Shetty Resume"
    draggable="false"
  >
</div>

      <div class="fallback">
        Your browser can’t preview the PDF here.<br>
        <a href="assets/ravishshetty.pdf" target="_blank" rel="noopener">Open Resume PDF</a>
      </div>
    </section>
  </main>
</body>
</html>
